    properties:
      action:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyAction'
        description: Action specifies the action that the policy is applied to
        enum:
        - create
        - read
        - update
        - delete
        example: read
      effect:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyEffect'
        description: Effect specifies whether the policy is an allow or deny policy
        enum:
        - allow
        - deny
        example: allow
      id:
        description: ID is the unique identifier for the policy
        example: pol_8x2m9k4n7p5q
        type: string
      principal:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyPrincipal'
        description: Principal specifies which group of users the policy is applied
          to
        enum:
        - workspace_user
        - role
        - everyone
        example: role
      resource:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyResource'
        description: Resource specifies the resource type that the policy is applied
          to
        enum:
        - workspace
        - editor_script
        - query
        - workflow
        - workflow_run
        - connection
        - repository
        - repository_branch
        - repository_tag
        - repository_commit
        - repository_object
        - user
        - policy
        - invite
        - audit_log
        - documentation
        - billing
        - workspace_tag
        - assistant
        example: repository
      resource_id:
        description: |-
          ResourceID is used to specify which resource the policy is applied to.
          When undefined, the policy is applied to all resources of the given type.

          It is applicable for:
          - queries
          - workflows
          - connections
          - repositories
          - users

          It is not applicable for:
          - workspaces (policies are workspace scoped)
          - policies
          - invites
          - audit logs
          - editor scripts
          - documentation
          - billing

          Note that some resources point to their parent resource's ID:
          - repository objects, branches, tags, and commits point to their repository's ID
          - workflow runs point to their workflow's ID
        example: repo_8x2m9k4n7p5q
        type: string
      role:
        allOf:
        - $ref: '#/definitions/irminmodels.Role'
        description: Role is used to give a policy to a specific role
      user:
        allOf:
        - $ref: '#/definitions/irminmodels.User'
        description: User is used to give a policy to a specific workspace user
    required:
    - action
    - effect
    - id
    - principal
    - resource
    type: object
