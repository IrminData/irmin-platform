basePath: /api/v1
definitions:
  irmincore.ConnectorConfigurationRequest:
    properties:
      details:
        additionalProperties: {}
        description: Values for the required connector configuration as JSON object,
          like {"host":"db.example.com"}
        type: object
      settings:
        additionalProperties: {}
        description: Values for the optional connector configuration as JSON object,
          like {"ssl_enabled":"true"}
        type: object
    type: object
  irmincore.ConnectorRequest:
    properties:
      system_token:
        example: system_token_123
        maxLength: 100
        type: string
      url:
        example: https://example.com/connector
        type: string
    required:
    - system_token
    - url
    type: object
  irmincore.CreateAssistantConversationRequest:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      title:
        example: My conversation
        type: string
    type: object
  irmincore.CreateAssistantMessageRequest:
    properties:
      message:
        example: What is the capital of France?
        maxLength: 100
        type: string
    required:
    - message
    type: object
  irmincore.CreateBranchRequest:
    properties:
      from:
        example: main
        type: string
      is_immutable:
        example: false
        type: boolean
      name:
        example: feature/add-customer-data
        type: string
    required:
    - from
    - name
    type: object
  irmincore.CreateCommitRequest:
    properties:
      branch:
        example: main
        type: string
      message:
        example: Add customer data
        type: string
    required:
    - branch
    - message
    type: object
  irmincore.CreateConnectionRequest:
    properties:
      connector:
        example: conn_5p8q2n7m9x4k
        type: string
      description:
        example: Primary MySQL database for production customer data
        maxLength: 500
        type: string
      details:
        additionalProperties: {}
        description: Values for the required connector configuration as JSON object,
          like {"host":"db.example.com"}
        type: object
      documentation:
        example: '# Production Database'
        type: string
      name:
        example: Production MySQL Database
        maxLength: 100
        type: string
      settings:
        additionalProperties: {}
        description: Values for the optional connector configuration as JSON object,
          like {"ssl_enabled":"true"}
        type: object
    required:
    - connector
    - name
    type: object
  irmincore.CreateCredentialRequest:
    properties:
      expiry:
        description: Seconds until expiry
        example: 3600
        type: integer
      name:
        example: API Token
        maxLength: 100
        type: string
    required:
    - expiry
    - name
    type: object
  irmincore.CreateEditorItemRequest:
    properties:
      content:
        example: This is the content of the file
        type: string
      type:
        allOf:
        - $ref: '#/definitions/irmincore.EditorItemType'
        example: file
    required:
    - type
    type: object
  irmincore.CreatePolicyRequest:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyAction'
        enum:
        - create
        - read
        - update
        - delete
        example: read
      effect:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyEffect'
        enum:
        - allow
        - deny
        example: allow
      principal:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyPrincipal'
        enum:
        - workspace_user
        - role
        - everyone
        example: role
      resource:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyResource'
        enum:
        - workspace
        - editor_script
        - query
        - workflow
        - workflow_run
        - connection
        - repository
        - repository_branch
        - repository_tag
        - repository_commit
        - repository_object
        - user
        - policy
        - invite
        - audit_log
        - documentation
        - billing
        - workspace_tag
        example: repository
      resource_id:
        example: repo_8x2m9k4n7p5q
        type: string
      role_id:
        example: role_2a8m5x9n4p7s
        type: string
      user_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - action
    - effect
    - principal
    - resource
    type: object
  irmincore.CreateQueryRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
      sql:
        example: select * from $['demo-data;Meteo.json@main'] WHERE 'Granularity'
          = 'Hour' LIMIT 2;
        type: string
    required:
    - name
    type: object
  irmincore.CreateRepositoryRequest:
    properties:
      default_branch:
        example: main
        type: string
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      documentation:
        example: '# Customer Analytics Repository'
        type: string
      garbage_default_branch_retention_days:
        example: 30
        type: integer
      garbage_default_retention_days:
        example: 30
        type: integer
      is_immutable:
        example: false
        type: boolean
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
    required:
    - name
    type: object
  irmincore.CreateRepositoryTagRequest:
    properties:
      name:
        example: v1.0.0
        type: string
      ref:
        example: main
        type: string
    required:
    - name
    - ref
    type: object
  irmincore.CreateTagRequest:
    properties:
      color:
        example: '#000000'
        type: string
      description:
        example: Customer analytics tag
        maxLength: 200
        type: string
      name:
        example: v1.0.0
        type: string
    required:
    - name
    type: object
  irmincore.CreateWorkspaceRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
    required:
    - name
    type: object
  irmincore.EditorItemType:
    enum:
    - file
    - folder
    type: string
    x-enum-varnames:
    - EditorItemTypeFile
    - EditorItemTypeFolder
  irmincore.ExecuteEditorItemRequest:
    properties:
      input:
        items:
          $ref: '#/definitions/irminmodels.ActionInputData'
        type: array
    type: object
  irmincore.ExecuteSQLRequest:
    properties:
      sql:
        example: select * from $['demo-data;Meteo.json@main'] WHERE 'Granularity'
          = 'Hour' LIMIT 2;
        type: string
    type: object
  irmincore.MergeRefsRequest:
    properties:
      allow_empty:
        example: false
        type: boolean
      base_ref:
        example: main
        type: string
      compare_ref:
        example: feature/add-customer-data
        type: string
      description:
        example: Merge feature branch into main
        type: string
      squash:
        example: false
        type: boolean
      strategy:
        enum:
        - default
        - dest-wins
        - source-wins
        example: default
        type: string
    required:
    - base_ref
    - compare_ref
    - strategy
    type: object
  irmincore.MoveEditorItemRequest:
    properties:
      destination_path:
        example: /path/to/new/location
        type: string
    required:
    - destination_path
    type: object
  irmincore.MoveObjectRequest:
    properties:
      new_path:
        example: path/to/new/location
        type: string
    required:
    - new_path
    type: object
  irmincore.QueryGenerationRequest:
    properties:
      conversation_id:
        description: Optional conversation ID to continue an existing conversation
        type: string
      metadata:
        additionalProperties: {}
        description: Optional metadata for the request
        type: object
      prompt:
        description: Natural language prompt describing the desired query
        maxLength: 1000
        minLength: 1
        type: string
      repository_ref:
        description: Optional repository reference (branch, tag, commit)
        type: string
      repository_slug:
        description: Optional repository slug for repository-specific queries
        type: string
    required:
    - prompt
    type: object
  irmincore.RevertUncommittedChangesRequest:
    properties:
      branch:
        example: main
        type: string
      path:
        example: path/to/file.txt
        type: string
      path_type:
        example: file
        type: string
    required:
    - branch
    type: object
  irmincore.ScriptGenerationRequest:
    properties:
      conversation_id:
        description: Optional conversation ID to continue an existing conversation
        type: string
      metadata:
        additionalProperties: {}
        description: Optional metadata for the request
        type: object
      prompt:
        description: Natural language prompt describing the desired script
        maxLength: 1000
        minLength: 1
        type: string
    required:
    - prompt
    type: object
  irmincore.SendInviteRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      role:
        example: admin
        maxLength: 50
        type: string
    required:
    - email
    - role
    type: object
  irmincore.TransferConnectionOwnershipRequest:
    properties:
      new_owner_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - new_owner_id
    type: object
  irmincore.TransferOwnershipRequest:
    properties:
      new_owner_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - new_owner_id
    type: object
  irmincore.TransferQueryOwnershipRequest:
    properties:
      new_owner_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - new_owner_id
    type: object
  irmincore.TransferRepositoryOwnershipRequest:
    properties:
      new_owner_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - new_owner_id
    type: object
  irmincore.TransferWorkflowOwnershipRequest:
    properties:
      new_owner_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    required:
    - new_owner_id
    type: object
  irmincore.UpdateAssistantConversationRequest:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      title:
        example: My conversation
        type: string
    type: object
  irmincore.UpdateBranchRequest:
    properties:
      is_immutable:
        example: false
        type: boolean
      name:
        example: feature/add-customer-data
        type: string
    type: object
  irmincore.UpdateConnectionRequest:
    properties:
      connector:
        example: conn_5p8q2n7m9x4k
        type: string
      description:
        example: Primary MySQL database for production customer data
        maxLength: 500
        type: string
      details:
        additionalProperties: {}
        description: Values for the required connector configuration as JSON object,
          like {"host":"db.example.com"}
        type: object
      documentation:
        example: '# Production Database'
        type: string
      name:
        example: Production MySQL Database
        maxLength: 100
        type: string
      settings:
        additionalProperties: {}
        description: Values for the optional connector configuration as JSON object,
          like {"ssl_enabled":"true"}
        type: object
    type: object
  irmincore.UpdateInviteRequest:
    properties:
      role:
        example: admin
        maxLength: 50
        type: string
    required:
    - role
    type: object
  irmincore.UpdatePolicyRequest:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyAction'
        enum:
        - create
        - read
        - update
        - delete
        example: read
      effect:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyEffect'
        enum:
        - allow
        - deny
        example: allow
      principal:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyPrincipal'
        enum:
        - workspace_user
        - role
        - everyone
        example: role
      resource:
        allOf:
        - $ref: '#/definitions/irminmodels.PolicyResource'
        enum:
        - workspace
        - editor_script
        - query
        - workflow
        - workflow_run
        - connection
        - repository
        - repository_branch
        - repository_tag
        - repository_commit
        - repository_object
        - user
        - policy
        - invite
        - audit_log
        - documentation
        - billing
        - workspace_tag
        example: repository
      resource_id:
        example: repo_8x2m9k4n7p5q
        type: string
      role_id:
        example: role_2a8m5x9n4p7s
        type: string
      user_id:
        example: usr_2k8n9q1m7p3x4z
        type: string
    type: object
  irmincore.UpdateQueryRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
      sql:
        example: select * from $['demo-data;Meteo.json@main'] WHERE 'Granularity'
          = 'Hour' LIMIT 2;
        type: string
    type: object
  irmincore.UpdateRepositoryRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      documentation:
        example: '# Customer Analytics Repository'
        type: string
      garbage_default_branch_retention_days:
        example: 30
        type: integer
      garbage_default_retention_days:
        example: 30
        type: integer
      is_immutable:
        example: false
        type: boolean
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
    type: object
  irmincore.UpdateTagRequest:
    properties:
      color:
        example: '#000000'
        type: string
      description:
        example: Customer analytics tag
        maxLength: 200
        type: string
      name:
        example: v1.0.0
        type: string
    type: object
  irmincore.UpdateUserRolesRequest:
    properties:
      roles:
        example:
        - role_2a8m5x9n4p7s
        - role_1a2m3x4n5p6s
        items:
          type: string
        type: array
    required:
    - roles
    type: object
  irmincore.UpdateWorkflowRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      documentation:
        example: '# Customer Analytics Workflow'
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
    type: object
  irmincore.UpdateWorkspaceRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
    type: object
  irmincore.UploadObjectFromURLRequest:
    properties:
      headers:
        additionalProperties:
          type: string
        example:
          Authorization: ' Bearer <token>'
        type: object
      url:
        example: https://example.com/file.json
        type: string
    required:
    - url
    type: object
  irmincore.WorkflowRequest:
    properties:
      description:
        example: Customer data analysis and reporting
        maxLength: 500
        type: string
      documentation:
        example: '# Customer Analytics Workflow'
        type: string
      name:
        example: Customer Analytics
        maxLength: 100
        type: string
      schedule:
        allOf:
        - $ref: '#/definitions/irminmodels.Schedule'
        description: Schedule configuration
      type:
        allOf:
        - $ref: '#/definitions/irminmodels.WorkflowableType'
        enum:
        - import
        - action
        - export
        - pipeline
        example: import
      workflowable:
        allOf:
        - $ref: '#/definitions/irminmodels.Workflowable'
        description: Workflowable configuration
    required:
    - name
    - type
    type: object
  irminmodels.APIToken:
    properties:
      created_at:
        example: "2025-01-15T10:30:00Z"
        type: string
      expiry:
        example: "2025-01-15T10:30:00Z"
        type: string
      id:
        example: token_1a2b3c
        type: string
      name:
        example: API Token 1
        maxLength: 100
        type: string
      token:
        example: 1a2b3c4d5e6f7g8h9i0j1k22x3y4z5a6b7c8d9e0
        minLength: 64
        type: string
      updated_at:
        example: "2025-12-01T14:22:30Z"
        type: string
    required:
    - created_at
    - expiry
    - id
    - name
    - updated_at
    type: object
  irminmodels.ActionInputData:
    properties:
      repository:
        example: customer-analytics
        type: string
      repository_path:
        example: /data/customers.csv
        type: string
      repository_ref:
        example: main
        type: string
    required:
    - repository
    - repository_path
    - repository_ref
    type: object
  irminmodels.AssistantConversation:
    properties:
      assistant_messages:
        type: integer
      created_at:
        example: "2025-01-15T10:30:00Z"
        type: string
      estimated_tokens:
        type: integer
      id:
        example: assistant_conversation_1a2b3c
        type: string
      last_message_at:
        type: string
      messages:
        items:
          $ref: '#/definitions/irminmodels.AssistantMessage'
        type: array
      metadata:
        additionalProperties: {}
        type: object
      title:
        example: My conversation
        type: string
      total_messages:
        type: integer
      updated_at:
        example: "2025-12-01T14:22:30Z"
        type: string
      user_id:
        example: user_1a2b3c
        type: string
      user_messages:
        type: integer
      workspace_id:
        example: workspace_1a2b3c
        type: string
    required:
    - created_at
    - id
    - title
    - updated_at
    - user_id
    - workspace_id
    type: object
  irminmodels.AssistantMessage:
    properties:
      ai_model:
        type: string
      block_index:
        type: integer
      content:
        type: string
      content_type:
        allOf:
        - $ref: '#/definitions/irminmodels.AssistantMessageContentType'
        example: text
      conversation_id:
        example: assistant_conversation_1a2b3c
        type: string
      created_at:
        example: "2025-01-15T10:30:00Z"
        type: string
      error_message:
        type: string
      id:
        example: assistant_message_1a2b3c
        type: string
      input_tokens:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      output_tokens:
        type: integer
      role:
        $ref: '#/definitions/irminmodels.AssistantMessageRole'
      sent_at:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/irminmodels.AssistantMessageStatus'
        enum:
        - pending
        - sent
        - error
        - failed
      updated_at:
        example: "2025-01-15T10:30:00Z"
        type: string
    required:
    - conversation_id
    - created_at
    - id
    - status
    - updated_at
    type: object
  irminmodels.AssistantMessageContentType:
    enum:
    - text
    - thinking
    - redacted_thinking
    - tool_use
    - server_tool_use
    - web_search_tool_result
    - code_execution_tool_result
    - mcp_tool_use
    - mcp_tool_result
    - container_upload
    type: string
    x-enum-varnames:
    - AssistantMessageContentTypeText
    - AssistantMessageContentTypeThinking
    - AssistantMessageContentTypeRedactedThinking
    - AssistantMessageContentTypeToolUse
    - AssistantMessageContentTypeServerToolUse
    - AssistantMessageContentTypeWebSearchToolResult
    - AssistantMessageContentTypeCodeExecutionToolResult
    - AssistantMessageContentTypeMCPToolUse
    - AssistantMessageContentTypeMCPToolResult
    - AssistantMessageContentTypeContainerUpload
  irminmodels.AssistantMessageRole:
    enum:
    - user
    - assistant
    type: string
    x-enum-varnames:
    - AssistantMessageRoleUser
    - AssistantMessageRoleAssistant
  irminmodels.AssistantMessageStatus:
    enum:
    - pending
    - sent
    - error
    - failed
    type: string
    x-enum-varnames:
    - AssistantMessageStatusPending
    - AssistantMessageStatusSent
    - AssistantMessageStatusError
    - AssistantMessageStatusFailed
  irminmodels.Branch:
    properties:
      default:
        description: Whether the branch is the default branch. Only one branch can
          be default, usually "main"
        example: true
        type: boolean
      is_immutable:
        description: Whether the branch is immutable and cannot be modified. Used
          for example for migrations
        example: false
        type: boolean
      name:
        description: Name of the branch
        example: main
        maxLength: 100
        type: string
    required:
    - name
    type: object
  irminmodels.BranchGarbageCollectionRules:
    properties:
      branch_id:
        example: main
        type: string
      retention_days:
        example: 30
        maximum: 3650
        minimum: 0
        type: integer
    required:
    - branch_id
    - retention_days
    type: object
  irminmodels.ChangeItem:
    properties:
      object:
        allOf:
        - $ref: '#/definitions/irminmodels.Object'
        description: Object affected by the change
      size:
        description: Size of the change
        example: 100
        minimum: 0
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/irminmodels.ChangeType'
        description: Type of the change (e.g., added, removed, changed, etc.)
        enum:
        - added
        - removed
        - changed
        - conflict
        - moved
        example: added
    required:
    - object
    - size
    - type
    type: object
  irminmodels.ChangeType:
    enum:
    - added
    - removed
    - changed
    - conflict
    - moved
    type: string
    x-enum-varnames:
    - ChangeTypeAdded
    - ChangeTypeRemoved
    - ChangeTypeChanged
    - ChangeTypeConflict
    - ChangeTypeMoved
  irminmodels.Commit:
    properties:
      author:
        description: Commit author
        example: John Doe
        type: string
      hash:
        description: Hash of the commit
        example: 1a2b3c4dn7o8p9q0r1s2t3u4v5w6x7y8z9a0b1c2d3
        type: string
      message:
        description: Commit message
        example: Initial commit
        type: string
      previous_hash:
        description: Previous commit hash, if any (optional)
        example: 16z7a8b9c02j3k4l5m6n7o8p9q0r1
        type: string
      timestamp:
        description: Commit timestamp
        example: "2025-01-15T10:30:00Z"
        type: string
    required:
    - author
    - hash
    - message
    - timestamp
    type: object
  irminmodels.Connection:
    properties:
      connector:
        $ref: '#/definitions/irminmodels.Connector'
      description:
        example: Primary MySQL database
        maxLength: 500
        type: string
      details:
        allOf:
        - $ref: '#/definitions/irminmodels.CustomFieldValues'
        description: Values for the required connector configuration as JSON object,
          like {"host":"db.example.com"}
      documentation:
        example: '# Production Database'
        type: string
      id:
        example: conn_5p8q2n7m9x4k
        type: string
      name:
        example: Production MySQL Database
        maxLength: 100
        type: string
      owner:
        $ref: '#/definitions/irminmodels.User'
      settings:
        allOf:
        - $ref: '#/definitions/irminmodels.CustomFieldValues'
        description: Values for the optional connector configuration as JSON object,
          like {"ssl_enabled":"true"}
      tags:
        items:
          $ref: '#/definitions/irminmodels.Tag'
        type: array
    required:
    - connector
    - id
    - name
    - owner
    type: object
  irminmodels.Connector:
    properties:
      author:
        description: Author of the connector
        example: Irmin Team
        maxLength: 100
        type: string
      author_email:
        description: Author's email address, eg. who to contact if there are any issues
          with the connector
        example: connectors@irmin.dev
        type: string
      capabilities:
        description: Array of capabilities of the connector, eg. what kind of operations
          the connector can perform
        example:
        - pull
        - push
        items:
          $ref: '#/definitions/irminmodels.ConnectorCapability'
        type: array
      categories:
        description: Array of categories associated with the connector, eg. what kind
          of connector it is
        example:
        - database
        items:
          $ref: '#/definitions/irminmodels.ConnectorCategory'
        type: array
      description:
        description: Description of the connector
        example: Connect to MySQL databases for data extraction and synchronization
        maxLength: 500
        type: string
      id:
        description: ID is a unique SQIDidentifier of the connector
