      no_binary:
        example: true
        type: boolean
      no_groups:
        example: false
        type: boolean
      no_structured:
        example: false
        type: boolean
      only_binary:
        example: false
        type: boolean
      only_groups:
        example: false
        type: boolean
      only_structured:
        example: true
        type: boolean
      restricted_content_types:
