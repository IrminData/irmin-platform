            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Apply JSON-Patch operations to Stripe resources
      tags:
      - stripe
  /stripe/operation/pull:
    post:
      consumes:
      - multipart/form-data
      description: Pull Stripe resources (customers, charges, subscriptions, invoices,
        payouts) as JSON files. If path is empty, every pull-enabled resource is returned.
        Response is a ZIP archive of the resulting files.
      parameters:
      - description: Optional resource name (e.g., 'customers') or `resource/id` for
          single-record pull
        in: formData
        name: path
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: ZIP archive of pulled JSON files (one per resource)
          schema:
            type: file
        "400":
          description: Bad request - invalid operation token
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized - invalid or missing authentication
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Operation not found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Operation already running
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Pull data from Stripe
      tags:
      - stripe
  /stripe/operation/push:
    post:
      consumes:
      - multipart/form-data
      description: 'Push JSON records to Stripe. Files under `<resource>/new-*.json`
        create new records; files under `<resource>/<id>.json` update existing ones.
        Supported resources: customers, invoices, products, prices.'
      parameters:
      - description: ZIP containing JSON resource files
        in: formData
        name: file
        required: true
        type: file
      - description: Optional target path selector (file or directory prefix like
          `customers/`)
        in: formData
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data pushed successfully
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad request - invalid operation token or file format
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Operation not found
          schema:
            $ref: '#/definitions/fiber.Map'
        "409":
          description: Operation already running
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Push data to Stripe
      tags:
      - stripe
  /stripe/operation/schema/{operation}:
    post:
      consumes:
      - application/json
