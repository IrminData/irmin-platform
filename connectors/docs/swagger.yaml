        - pull
        - push
        - patch
        in: path
        name: operation
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Operation schema retrieved successfully
          schema:
            $ref: '#/definitions/irminmodels.ObjectSchema'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "404":
          description: Operation not found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Get Stripe operation schema
      tags:
      - stripe
  /swagger:
    get:
      consumes:
      - application/json
      description: Interactive API documentation interface using Swagger UI
      produces:
