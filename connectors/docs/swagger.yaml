        type: boolean
      required_with:
        example:
        - field1
        - field2
        items:
          type: string
        type: array
      secret:
        example: false
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/irminmodels.FieldType'
        enum:
        - text
        - textarea
        - password
        - email
        - checkbox
        - integer
        - float
        - select
        - radio
        - file
        - date
        - time
        - datetime
