  /swagger.json:
    get:
      consumes:
      - application/json
      description: Retrieve the OpenAPI 3.0 specification in JSON format for this
        API
      produces:
      - application/json
      responses:
        "200":
          description: OpenAPI 3.0 specification in JSON format
          schema:
            type: object
        "404":
          description: Swagger specification file not found
          schema:
            $ref: '#/definitions/irminmodels.IrminAPIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/irminmodels.IrminAPIResponse'
      summary: Get Swagger JSON specification
      tags:
      - documentation
schemes:
- https
securityDefinitions:
  OperationTokenAuth:
    description: Operation token with Bearer prefix - received from operation/init
      and used for data operation endpoints
    in: header
    name: Authorization
    type: apiKey
  SystemTokenAuth:
    description: System token with Bearer prefix - used for connector registration
      and initialization endpoints
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
