definitions:
  db.ConnectorRegistration:
    properties:
      connectorName:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      irminID:
        type: string
      systemToken:
        type: string
      updatedAt:
        type: string
    type: object
  db.LogEventType:
    enum:
    - ERROR
    - INFO
    - WARNING
    type: string
    x-enum-varnames:
    - LogEventTypeError
    - LogEventTypeInfo
    - LogEventTypeWarning
  db.Operation:
    properties:
      configHash:
        type: string
      connectorRegistration:
        $ref: '#/definitions/db.ConnectorRegistration'
      connectorRegistrationID:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      details:
        items:
          type: integer
        type: array
      id:
        type: integer
      logs:
        items:
          $ref: '#/definitions/db.OperationLog'
        type: array
      settings:
        items:
          type: integer
        type: array
      updatedAt:
        type: string
    type: object
  db.OperationLog:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      message:
        type: string
      metadata:
        description: 'Arbitrary structured data that stores information about the
          log - e.g., userId: 100.'
        items:
          type: integer
        type: array
      operation:
        $ref: '#/definitions/db.Operation'
      operation_id:
        type: integer
      type:
        $ref: '#/definitions/db.LogEventType'
      updatedAt:
        type: string
    type: object
  db.Subscription:
    properties:
      connectorRegistration:
        $ref: '#/definitions/db.ConnectorRegistration'
      connectorRegistrationID:
        type: integer
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      operation:
        $ref: '#/definitions/db.Operation'
      operationID:
        type: integer
      updatedAt:
        type: string
      webhookAccessToken:
        type: string
      webhookUrl:
        type: string
    type: object
  fiber.Map:
    additionalProperties: {}
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  irminmodels.AlreadyRunningBody:
    properties:
      error:
        description: |-
          Error is the stable human-readable message. Always
          "Operation is already running" — kept for backwards
          compatibility with clients that key off the error string.
        example: Operation is already running
        type: string
      job_id:
        description: |-
          JobID is the opaque identifier of the currently-running job.
          Clients can pass this straight to CancelOperationJob or
          GetOperationJobStatus. Empty only for legacy holders that have
          not migrated to the JobManager.Begin path yet.
        example: opjob_9m3x7k2n8q5p
        type: string
      kind:
        description: |-
          Kind is the operation kind holding the lock. One of "pull",
          "push", "patch", "schema". Helps operators distinguish a
          long-running pull from a fast sync push when triaging
          contention.
        example: pull
        type: string
      operation_id:
        description: |-
          OperationID is the connector-service-local numeric ID of the
          operation the lock was taken on. Present so operator-facing
          logs can cross-reference the operation row directly.
        example: 42
        type: integer
      started_at:
        description: |-
          StartedAt is when the in-flight job was accepted. Clients can
          compute elapsed time to decide whether to wait or cancel. nil
          for legacy sync holders with no registered row.

          Pointer rather than time.Time + omitempty because encoding/json's
          omitempty does not treat a zero time.Time as empty — it would
          serialise as "0001-01-01T00:00:00Z" on the wire. Matches the
          convention used by ExpiresAt above and the *time.Time fields
          in the other models in this package.
        type: string
    type: object
  irminmodels.ConnectionOAuthConfig:
    properties:
      authorization_url:
        description: |-
          AuthorizationURL is the user-agent-facing endpoint where the end
          user approves the connection. Absolute https:// URL.
        example: https://app.hubspot.com/oauth/authorize
        type: string
      dcr_endpoint:
        description: |-
          DCREndpoint is optional (RFC 7591). When set, the Core can
          dynamically register an OAuth client per workspace on first use,
          skipping the need for an admin-configured app. MCP-compatible
          vendors (Intercom, Linear, Sentry, ...) typically provide this.
        example: https://api.example.com/oauth/register
        type: string
      extra_params:
        additionalProperties:
          type: string
        description: |-
          ExtraParams are vendor-specific parameters appended to the
          authorization request (e.g., access_type=offline, prompt=consent).
          Keys that would override security-critical OAuth params are
          silently dropped by the Core.
        example:
          access_type: offline
        type: object
      pkce:
        description: |-
          PKCE must be true for new connectors. The Core refuses to run a
          flow when this is false. Retained as a field (rather than an
          always-true default) so the contract is explicit on the wire.
        example: true
        type: boolean
      provider:
        description: |-
          Provider is a short canonical identifier for the vendor, e.g.
          "hubspot", "stripe", "intercom". Used in logs + error messages.
        example: hubspot
        maxLength: 64
        type: string
      revocation_url:
        description: |-
          RevocationURL is optional (RFC 7009). When set, the Core POSTs the
          token here on disconnect so the vendor drops the grant immediately.
        example: https://api.example.com/oauth/revoke
        type: string
      scopes:
        description: |-
          Scopes is the set of OAuth scopes the connector declares it needs.
          Read-only by default; connectors should follow least-privilege.
        example:
        - crm.objects.contacts.read
        - crm.objects.deals.read
        items:
          type: string
        type: array
      token_url:
        description: TokenURL is the token endpoint (RFC 6749 §3.2). Absolute https://
          URL.
        example: https://api.hubapi.com/oauth/v1/token
        type: string
      userinfo_url:
        description: |-
          UserinfoURL is optional. When set, the Core may call it after a
          successful exchange to populate a friendly "connected as <who>"
          label in the UI. Not used in the Phase 2 wiring; reserved.
        example: https://api.example.com/oauth/userinfo
        type: string
    required:
    - authorization_url
    - provider
    - scopes
    - token_url
    type: object
  irminmodels.ConnectorCapability:
    enum:
    - pull
    - push
    - apply_patch
    - patch_event
    type: string
    x-enum-varnames:
    - ConnectorCapabilityPull
    - ConnectorCapabilityPush
    - ConnectorCapabilityApplyPatch
    - ConnectorCapabilityPatchEvent
  irminmodels.ConnectorCategory:
    enum:
    - database
    - crm
    - erp
    - warehouse
    - marketing
    - analytics
    - storage
    - messaging
    - payment
    - social
    - calendar
    - project_management
    - ecommerce
    - iot
    - monitoring
    - other
    type: string
    x-enum-varnames:
    - ConnectorCategoryDatabase
    - ConnectorCategoryCRM
    - ConnectorCategoryERP
    - ConnectorCategoryWarehouse
    - ConnectorCategoryMarketing
    - ConnectorCategoryAnalytics
    - ConnectorCategoryStorage
    - ConnectorCategoryMessaging
    - ConnectorCategoryPayment
    - ConnectorCategorySocial
    - ConnectorCategoryCalendar
    - ConnectorCategoryProjectManagement
    - ConnectorCategoryECommerce
    - ConnectorCategoryIoT
    - ConnectorCategoryMonitoring
    - ConnectorCategoryOther
  irminmodels.ConnectorConfigurationValidationResult:
    properties:
      can_connect:
        description: Indicates if the connector can connect to the external system
        example: true
        type: boolean
      connection_details_valid:
        description: Indicates if the connection details are valid
        example: true
        type: boolean
      connection_settings_valid:
        description: Indicates if the connection settings are valid
        example: true
        type: boolean
      errors:
        description: (Optional) Array of validation errors
        example:
        - Invalid host address
        - Authentication failed
        items:
          type: string
        type: array
      ok:
        description: Indicates if the configuration is valid
        example: true
        type: boolean
    type: object
  irminmodels.DynamicField:
    properties:
      default:
        example: Default value
        type: string
      example:
        example: Example value
        maxLength: 100
        type: string
      help_text:
        example: This is a help text
        maxLength: 200
        type: string
      label:
        example: Name
        maxLength: 100
        type: string
      max:
        example: 100
        type: number
      min:
        example: 1
        type: number
      multiple:
        example: false
        type: boolean
      options:
        items:
          $ref: '#/definitions/irminmodels.SelectOption'
        type: array
      required:
