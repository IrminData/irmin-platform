    - textarea
    - password
    - email
    - checkbox
    - integer
    - float
    - select
    - radio
    - file
    - date
    - time
    - datetime
    type: string
    x-enum-varnames:
    - FieldTypeText
    - FieldTypeTextarea
    - FieldTypePassword
    - FieldTypeEmail
    - FieldTypeCheckbox
    - FieldTypeInteger
    - FieldTypeFloat
    - FieldTypeSelect
    - FieldTypeRadio
    - FieldTypeFile
    - FieldTypeDate
    - FieldTypeTime
    - FieldTypeDatetime
  irminmodels.GroupSchemaRestrictions:
