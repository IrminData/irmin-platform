  irminmodels.JobErrorBody:
    properties:
      error:
        description: |-
          Error is the operator-facing human-readable message. Stable
          enough for log grep but not a machine-readable code.
        example: failed to load job
        type: string
      job_id:
        description: |-
          JobID echoes the ID from the URL when the server could parse
          one. Empty for request-level failures (malformed URL, missing
          path parameter).
        example: opjob_9m3x7k2n8q5p
        type: string
      reason:
        allOf:
        - $ref: '#/definitions/irminmodels.JobErrorReason'
        description: |-
          Reason is the machine-readable failure classification. See
          JobErrorReason for the stable value set.
        example: transient_db_error
      retryable:
        description: |-
          Retryable reports whether the caller should retry the same
          request after a short backoff. False for any terminal failure
          mode (not_found, corrupted_job_state, invalid_request).
        example: true
        type: boolean
    type: object
  irminmodels.JobErrorReason:
    enum:
    - transient_db_error
    - corrupted_job_state
    - not_found
    - invalid_request
    - internal
    type: string
    x-enum-varnames:
    - JobErrorReasonTransientDB
    - JobErrorReasonCorruptedRow
    - JobErrorReasonNotFound
    - JobErrorReasonInvalidRequest
    - JobErrorReasonInternal
  irminmodels.ObjectSchema:
    properties:
      children:
        description: Group schema
        items:
          $ref: '#/definitions/irminmodels.ObjectSchema'
        type: array
      content_type:
        example: application/json
        type: string
      description:
        example: Customer data in JSON format with contact information
        type: string
      last_modified:
        example: "2025-12-01T14:22:30Z"
        type: string
      name:
        example: customers.json
        maxLength: 255
        type: string
      path:
        example: /data/customers/customers.json
        type: string
      restrictions:
        allOf:
        - $ref: '#/definitions/irminmodels.GroupSchemaRestrictions'
        description: Restrictions are not required, but are available for group schemas
      s3_path_selector:
        example: s3://workspace-slug-repository-slug/main/file.json
        type: string
      schema:
        allOf:
        - $ref: '#/definitions/irminmodels.JSONSchema'
        description: Structured schema
      size:
        description: Structured or Binary schema
        example: 1048576
        type: integer
      sql_selector:
        example: $['workspace-slug;repository-slug;file.json@main']
        type: string
      type:
        allOf:
        - $ref: '#/definitions/irminmodels.ObjectType'
        enum:
        - group
        - structured
        - binary
        example: structured
    required:
    - type
    type: object
  irminmodels.ObjectType:
    enum:
    - group
    - structured
    - binary
    type: string
    x-enum-varnames:
    - ObjectTypeGroup
    - ObjectTypeStructured
    - ObjectTypeBinary
  irminmodels.SelectOption:
    properties:
      key:
        example: key1
        maxLength: 50
        type: string
      value:
        example: Value 1
        maxLength: 100
        type: string
    required:
    - key
    - value
    type: object
  irminmodels.StartOperationJobResponse:
    properties:
      job_id:
        description: |-
          JobID is the identifier the caller uses on subsequent
          /operation/status and /operation/result calls.
        example: opjob_9m3x7k2n8q5p
        type: string
      operation_token:
        description: |-
          OperationToken is the per-job bearer credential for lifecycle
          routes. Minted by the server on Start*; TTL matches the
          underlying OperationJob row.
        example: optk_7f3d2a9c1e6b
        type: string
    type: object
  models.ConnectorDetails:
    properties:
      api_base_url:
        example: https://connectors.irmin.co/mysql
        type: string
      author:
        example: Irmin Team
        type: string
      author_email:
        example: hello@irmin.co
        type: string
      capabilities:
        example:
        - pull
        - push
        items:
          $ref: '#/definitions/irminmodels.ConnectorCapability'
          enum:
          - pull
          - push
          - apply_patch
          - patch_event
        type: array
      categories:
        example:
        - database
        - crm
        - erp
        - warehouse
        - marketing
        - analytics
        - storage
        - messaging
        - payment
        - social
        - calendar
        - project_management
        - ecommerce
        - iot
        - monitoring
        - other
        items:
          $ref: '#/definitions/irminmodels.ConnectorCategory'
        type: array
      connection_oauth_config:
        allOf:
        - $ref: '#/definitions/irminmodels.ConnectionOAuthConfig'
        description: |-
          ConnectionOAuthConfig is optional. When set, the connector declares
          it uses OAuth 2.0 (authorization code + PKCE) for authenticating a
          Connection, and Irmin Core runs the flow on the user's behalf. Nil
          means the connector uses the legacy DynamicField form path
          (password / API key / etc.). See OAUTH-CONNECTORS.md for the flow
          + patterns + which vendors are planned.
      description:
        example: Connect to MySQL databases for data extraction and synchronization
        type: string
      logo_url:
        example: https://cdn.irmin.co/connectors/mysql.png
        type: string
      name:
        example: MySQL Database Connector
        type: string
      primary_category:
        allOf:
        - $ref: '#/definitions/irminmodels.ConnectorCategory'
        example: database
      read_more_url:
        example: https://docs.irmin.co/connectors/mysql
        type: string
      structure_version:
        example: 1.0.0
        type: string
      version:
        example: 1.2.3
        type: string
    type: object
host: connectors.irmin.co
info:
  contact:
    email: hello@irmin.co
    name: Irmin Team
    url: https://irmin.co
  description: Collection of connectors for Irmin to interact with external services
  termsOfService: http://irmin.co/terms
  title: Irmin Connectors
  version: 1.0.0
paths:
  /firecrawl/configuration/{key}/fields:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: Get dynamic configuration fields for the Firecrawl connector based
        on the configuration key (details or settings)
      parameters:
      - description: Configuration key
        enum:
        - details
        - settings
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Configuration fields retrieved successfully
          schema:
            additionalProperties:
              $ref: '#/definitions/irminmodels.DynamicField'
            type: object
        "400":
          description: Bad request - invalid configuration key
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized - invalid or missing authentication
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Get Firecrawl connector configuration fields
      tags:
      - firecrawl
  /firecrawl/configuration/validate:
    post:
      consumes:
      - multipart/form-data
      description: Validate Firecrawl configuration by checking the API key and operation
        parameters
      parameters:
      - description: Firecrawl API key
        in: formData
        name: details[api_key]
        required: true
        type: string
      - description: Operation type (scrape, crawl, map, search)
        in: formData
        name: details[operation_type]
        required: true
        type: string
      - description: Target URL (required for scrape, crawl, map)
        in: formData
        name: details[url]
        type: string
      - description: Search query (required for search)
        in: formData
        name: details[query]
        type: string
      - description: Output format (markdown, html, json)
        in: formData
        name: details[output_format]
        type: string
      - description: Maximum pages/results limit
        in: formData
        name: details[limit]
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Configuration validation result
          schema:
            $ref: '#/definitions/irminmodels.ConnectorConfigurationValidationResult'
        "400":
          description: Bad request - invalid configuration data
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized - invalid or missing authentication
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Validate Firecrawl connector configuration
      tags:
      - firecrawl
  /firecrawl/details:
    get:
      description: Returns an HTML page with information about the Firecrawl connector
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with connector details
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get Firecrawl connector details page
      tags:
      - firecrawl
  /firecrawl/info:
    get:
      consumes:
      - application/json
      description: Get detailed information about the Firecrawl connector including
        capabilities, configuration fields, and API endpoints
      produces:
      - application/json
      responses:
        "200":
          description: Firecrawl connector information retrieved successfully
          schema:
            $ref: '#/definitions/models.ConnectorDetails'
        "401":
          description: Unauthorized - invalid or missing authentication
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Get Firecrawl connector information
      tags:
      - firecrawl
  /firecrawl/operation/patch:
    post:
      consumes:
      - multipart/form-data
      description: Firecrawl connector does not support patch operations - it is read-only
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized - invalid or missing authentication
          schema:
            $ref: '#/definitions/fiber.Map'
        "501":
          description: Not implemented - Firecrawl connector does not support patch
            operations
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Firecrawl connector does not support patch operations
      tags:
      - firecrawl
  /firecrawl/operation/pull:
    post:
      consumes:
      - multipart/form-data
      description: Execute the configured Firecrawl operation (scrape, crawl, map,
        or search) and return the results as files.
      parameters:
      - description: Optional URL to scrape (overrides configured URL for single-page
          scraping)
