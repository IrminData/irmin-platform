  /googledrive/operation/pull:
    post:
      consumes:
      - multipart/form-data
      description: Starts an asynchronous pull job that fetches file metadata from
        Google Drive as a JSON file. The connection ID is captured from the request
        before the async worker starts so the worker can resolve OAuth tokens without
        a fiber.Ctx.
      parameters:
      - description: What to pull. Empty or 'files' / 'files.json' returns metadata
          for every accessible file as files.json. A Drive file ID downloads that
          single file. A Drive folder ID walks the folder (recursive per connection
          settings) and returns files.json plus one blob per downloaded file at files/<driveId>-<safeName>.<ext>.
        in: formData
        name: path
        type: string
      produces:
      - application/zip
      responses:
        "202":
          description: Pull job started
          schema:
            $ref: '#/definitions/fiber.Map'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/fiber.Map'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "428":
          description: OAuth not connected
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - SystemTokenAuth: []
      summary: Pull files from Google Drive
      tags:
      - googledrive
  /googledrive/operation/push:
    post:
      consumes:
      - multipart/form-data
      description: Upload files to the connected user's Google Drive as new files.
        The uploaded ZIP contents are created as individual Drive files under the
        optional path (treated as a folder hierarchy created on the fly).
      parameters:
      - description: ZIP file containing files to push to Google Drive
        in: formData
        name: file
        required: true
        type: file
      - description: Target folder path in Google Drive (e.g., '/Irmin/backup' — created
          if missing)
        in: formData
        name: path
        type: string
      produces:
      - application/json
      responses:
        "202":
