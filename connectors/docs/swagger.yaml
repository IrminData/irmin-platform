      - multipart/form-data
      description: Creates new Linear issues from JSON files in the uploaded ZIP.
        Files matching `issues/new-*.json` are turned into IssueCreate mutations;
        every other file is skipped with a log line. Each file's JSON must be a valid
        Linear IssueCreateInput including a `teamId` UUID (Linear's input type has
