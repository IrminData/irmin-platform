      security:
      - SystemTokenAuth: []
      summary: Push files to Google Drive
      tags:
      - googledrive
  /googledrive/operation/schema/{operation}:
    post:
      consumes:
      - application/json
      description: 'Returns the schema describing what files a pull operation produces
        and what a push operation accepts. The schema is path-aware: an empty path
        returns the legacy files.json catalogue alongside the user''s My Drive root;
        a Drive folder ID returns that folder''s direct children; a Drive file ID
        returns a single leaf.'
      parameters:
      - description: Operation type
        enum:
        - pull
        - push
        in: path
        name: operation
        required: true
        type: string
      - description: Drive resource to inspect. Empty / 'files' / 'files.json' returns
          the legacy metadata catalogue; 'root' returns My Drive's top level; any
          Drive folder/file ID is resolved via files.get.
