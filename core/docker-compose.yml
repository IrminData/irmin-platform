version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: irmin/api:dev
    env_file: .env
    depends_on:
      - db_api
      - lakefs
      - minio
    ports:
      - "8082:8082"
    # Volume mount disabled - use compiled binary from image
    # For development with hot reload, build locally: go build -o main .
    # volumes:
    #   - .:/app

  db_api:
    image: postgres:16
    environment:
      POSTGRES_USER: irmin
      POSTGRES_PASSWORD: irmin
      POSTGRES_DB: irmin_dev
    ports:
      - "5433:5432"
    volumes:
      - irmin_db_api:/var/lib/postgresql/data

  db_lakefs:
    image: postgres:16
    environment:
      POSTGRES_USER: lakefs
      POSTGRES_PASSWORD: lakefs
      POSTGRES_DB: lakefs_dev
    ports:
      - "5434:5432"
    volumes:
      - irmin_db_lakefs:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - irmin_minio:/data

  lakefs:
    image: treeverse/lakefs
    depends_on:
      - db_lakefs
      - minio
    ports:
      - "8000:8000"
    environment:
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: devsecret
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgres://lakefs:lakefs@db_lakefs:5432/lakefs_dev?sslmode=disable
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minio
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minio12345
      LAKEFS_ACTIONS_ENABLED: "true"
      LAKEFS_ACTIONS_ENV_ENABLED: "true"
      LAKEFS_ACTIONS_ENV_PREFIX: LAKEFSACTIONS_
      LAKEFSACTIONS_IRMIN_API_TOKEN: "random-api-system-token-here"

volumes:
  irmin_db_api:
  irmin_db_lakefs:
  irmin_minio: