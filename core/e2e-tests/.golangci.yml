# golangci-lint configuration for E2E tests

version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/IrminData/irmin-e2e-tests

    golines:
      max-len: 120

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - loggercheck
    - makezero
    - mirror
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  # Disabled linters for CLI E2E test tool:
  # - forbidigo: CLI tool needs fmt.Print for user output
  # - gomoddirectives: Local replace directive needed for development
  # - mnd: Magic numbers acceptable in test assertions
  # - perfsprint: Performance not critical for test tool
  # - sloglint: Context-based logging not needed for simple test runner

  # Disabled linters for E2E test scenarios:
  # - dupl: Similar test patterns are expected in E2E tests
  disable:
    - dupl

  settings:
    cyclop:
      max-complexity: 30
      package-average: 15.0

    depguard:
      rules:
        "deprecated":
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead

    errcheck:
      check-type-assertions: true

    exhaustive:
      check:
        - switch
        - map

    funlen:
      lines: 200
      statements: 70

    gocognit:
      min-complexity: 20

    gocritic:
      disabled-checks:
        - exitAfterDefer
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    gosec:
      excludes:
        - G404 # Weak random is acceptable for test naming

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow # Shadowing acceptable in simple test code

    nakedret:
      max-func-lines: 0

    nolintlint:
      allow-no-explanation: [funlen, gocognit, golines]
      require-explanation: true
      require-specific: true

    reassign:
      patterns:
        - ".*"

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - text: 'should have a package comment'
        linters: [revive]
      - text: 'exported \S+ \S+ should have comment'
        linters: [revive]
      - text: 'parameter .* seems to be unused'
        linters: [revive]
