version: 2

updates:
  # Version-update PRs are paused during the monorepo cutover follow-up.
  # Security-update PRs remain enabled and are exempt from this limit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /connectors
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: main

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: main
