version: 2

updates:
  # Keep version updates grouped by project so each deployable remains independently testable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /connectors
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
