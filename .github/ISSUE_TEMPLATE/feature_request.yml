name: Feature request
description: Propose a focused improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Primary project
      options:
        - Core
        - AI
        - Console
        - Connectors
        - SDKs
        - Cross-project
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or capability, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
