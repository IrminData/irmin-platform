name: Go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "irmin/**"
      - "irmin-connectors/**"
      - "sdks/go/**"
      - "go.work"
      - "Makefile"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "irmin/**"
      - "irmin-connectors/**"
      - "sdks/go/**"
      - "go.work"
      - "Makefile"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Connectors
            module: irmin-connectors
          - name: Go SDK
            module: sdks/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: "${{ matrix.module }}/go.mod"
          cache-dependency-path: "${{ matrix.module }}/go.sum"
      - run: go test -timeout 2m ./...
        working-directory: ${{ matrix.module }}

  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            module: irmin
            version: v2.4.0
            timeout: 10m
          - name: Connectors
            module: irmin-connectors
            version: v2.6.1
            timeout: 5m
          - name: Go SDK
            module: sdks/go
            version: v2.6.1
            timeout: 5m
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: "${{ matrix.module }}/go.mod"
          cache-dependency-path: "${{ matrix.module }}/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ matrix.version }}
          working-directory: ${{ matrix.module }}
          args: "--timeout=${{ matrix.timeout }}"
          skip-cache: false
