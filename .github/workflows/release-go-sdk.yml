name: Release Go SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version in vX.Y.Z form
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-go-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - name: Validate release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be valid semantic version syntax beginning with v" >&2
            exit 1
          fi
          module=$(sed -n 's/^module //p' go.mod)
          test "$module" = "github.com/IrminData/irmin-platform/sdks/go"
          tag="sdks/go/$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          GOWORK=off go test -timeout 2m ./...
        working-directory: sdks/go
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="sdks/go/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Go SDK $VERSION"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "Go SDK $VERSION"
