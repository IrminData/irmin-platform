name: Irmin Console

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "irmin-console/**"
      - ".nvmrc"
      - ".github/workflows/irmin-console.yml"
  push:
    branches: [main]
    paths:
      - "irmin-console/**"
      - ".nvmrc"
      - ".github/workflows/irmin-console.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: irmin-console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: irmin-console/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm knip
