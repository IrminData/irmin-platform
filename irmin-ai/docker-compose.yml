version: "3.9"

services:
  irmin_ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: irmin/ai:dev
    env_file: .env
    depends_on:
      - db_ai
      - qdrant
    ports:
      - "3001:3000"   # host:container

  db_ai:
    image: postgres:16
    environment:
      POSTGRES_USER: irminai
      POSTGRES_PASSWORD: irminai
      POSTGRES_DB: irminai_dev
    ports:
      - "5436:5432"
    volumes:
      - irminai_db:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  irminai_db:
  qdrant_data: